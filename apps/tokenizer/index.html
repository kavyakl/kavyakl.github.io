<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tokenizer Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2"></script>
</head>
<body>
  <header>
    <h1>Tokenizer Playground</h1>
    <p>Explore how different models tokenize text using real production vocabularies.</p>
  </header>

  <main>
    <label for="model-select">Model</label>
    <select id="model-select">
      <option value="Xenova/gpt2">GPT-2</option>
      <option value="Xenova/LaMini-Flan-T5-783M">T5</option>
      <option value="Xenova/bert-base-uncased">BERT</option>
    </select>

    <label for="text-input">Input text</label>
    <textarea id="text-input" rows="8" placeholder="Type or paste text here...">The quick brown fox jumps over the lazy dog.</textarea>

    <button id="tokenize-btn">Tokenize</button>

    <section id="output">
      <h2>Tokens</h2>
      <div id="token-count"></div>
      <div id="tokens-list"></div>
    </section>
  </main>

  <script type="module" src="tokenizer.js"></script>
</body>
</html>
