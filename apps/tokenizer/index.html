<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tokenizer Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/gpt-tokenizer@1.0.1/lib/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@lenml/tokenizers@0.2.1/lib/index.js"></script>
</head>
<body>
  <header>
    <h1>Tokenizer Playground</h1>
    <p>Explore how different models tokenize text using real tokenizer libraries.</p>
  </header>

  <main>
    <label for="model-select">Model</label>
    <select id="model-select">
      <option value="gpt2">GPT-2</option>
      <option value="gpt4">GPT-4 (cl100k_base)</option>
      <option value="llama2">Llama 2</option>
      <option value="llama3">Llama 3</option>
      <option value="cohere">Cohere</option>
      <option value="claude">Claude</option>
    </select>

    <label for="text-input">Input text</label>
    <textarea id="text-input" rows="8" placeholder="Type or paste text here...">The quick brown fox jumps over the lazy dog.</textarea>

    <button id="tokenize-btn">Tokenize</button>

    <section id="output">
      <h2>Tokens</h2>
      <div id="token-count"></div>
      <div id="tokens-list"></div>
    </section>
  </main>

  <script src="tokenizer.js"></script>
</body>
</html>
