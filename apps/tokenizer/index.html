<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tokenizer Arena - Compare LLM Tokenizers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Compare how different LLM tokenizers (GPT-4, Claude, Llama 3, GPT-2) handle the same input text. See real token counts and token IDs." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:,">
</head>
<body>
  <header>
    <h1>🦙 Tokenizer Arena</h1>
    <p>Compare how different LLM tokenizers handle the same input text. Fewer tokens means cheaper inference and more context window space.</p>
  </header>

  <main>
    <div class="input-section">
      <label for="text-input">Input text</label>
      <textarea id="text-input" rows="6" placeholder="Type or paste text here...">The quick brown fox jumps over the lazy dog.</textarea>
      
      <div class="tokenizer-selection">
        <label>Select tokenizers to compare:</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="gpt2" checked> GPT-2</label>
          <label><input type="checkbox" value="gpt4"> GPT-4</label>
          <label><input type="checkbox" value="llama3"> Llama 3</label>
          <label><input type="checkbox" value="claude"> Claude 3</label>
        </div>
      </div>
      
      <button id="tokenize-btn">Compare Tokenizers</button>
      <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <span>Loading tokenizers...</span>
      </div>
    </div>

    <section id="output">
      <h2>Results</h2>
      <div id="summary-stats"></div>
      <div id="tokenizer-cards"></div>
    </section>
  </main>

  <!-- Load @lenml/tokenizers from CDN -->
  <script type="importmap">
  {
    "imports": {
      "@lenml/tokenizers": "https://www.unpkg.com/@lenml/tokenizers@3.7.2/dist/main.mjs",
      "@lenml/tokenizer-gpt2": "https://www.unpkg.com/@lenml/tokenizer-gpt2@3.7.2/dist/main.mjs",
      "@lenml/tokenizer-gpt4": "https://www.unpkg.com/@lenml/tokenizer-gpt4@3.7.2/dist/main.mjs",
      "@lenml/tokenizer-llama3": "https://www.unpkg.com/@lenml/tokenizer-llama3@3.7.2/dist/main.mjs",
      "@lenml/tokenizer-claude": "https://www.unpkg.com/@lenml/tokenizer-claude@3.7.2/dist/main.mjs"
    }
  }
  </script>
  <script type="module">
  // Tokenizer Arena - Using @lenml/tokenizers for real tokenization
  import { fromPreTrained as fromGPT2 } from '@lenml/tokenizer-gpt2';
  import { fromPreTrained as fromGPT4 } from '@lenml/tokenizer-gpt4';
  import { fromPreTrained as fromLlama3 } from '@lenml/tokenizer-llama3';
  import { fromPreTrained as fromClaude } from '@lenml/tokenizer-claude';

  const textInput = document.getElementById('text-input');
  const tokenizeBtn = document.getElementById('tokenize-btn');
  const summaryStats = document.getElementById('summary-stats');
  const tokenizerCards = document.getElementById('tokenizer-cards');
  const loadingDiv = document.getElementById('loading');

  // Tokenizer instances
  let tokenizers = {};

  // Initialize all tokenizers on page load
  async function initializeTokenizers() {
    loadingDiv.style.display = 'flex';
    loadingDiv.querySelector('span').textContent = 'Loading tokenizers...';
    
    try {
      console.log('Loading GPT-2 tokenizer...');
      const gpt2 = fromGPT2();
      console.log('GPT-2 loaded:', !!gpt2, 'Has encode:', typeof gpt2.encode);
      
      console.log('Loading GPT-4 tokenizer...');
      const gpt4 = fromGPT4();
      console.log('GPT-4 loaded:', !!gpt4, 'Has encode:', typeof gpt4.encode);
      
      console.log('Loading Llama 3 tokenizer...');
      const llama3 = fromLlama3();
      console.log('Llama 3 loaded:', !!llama3, 'Has encode:', typeof llama3.encode);
      
      console.log('Loading Claude tokenizer...');
      const claude = fromClaude();
      console.log('Claude loaded:', !!claude, 'Has encode:', typeof claude.encode);
      
      tokenizers = {
        gpt2: { name: 'GPT-2', encoding: 'r50k_base', tokenizer: gpt2 },
        gpt4: { name: 'GPT-4', encoding: 'cl100k_base', tokenizer: gpt4 },
        llama3: { name: 'Llama 3', encoding: 'llama3', tokenizer: llama3 },
        claude: { name: 'Claude 3', encoding: 'claude', tokenizer: claude }
      };
      
      loadingDiv.style.display = 'none';
      console.log('All tokenizers initialized successfully');
    } catch (error) {
      console.error('Failed to load tokenizers:', error);
      loadingDiv.innerHTML = `
        <div class="error-message" style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px;color:#b91c1c;">
          <strong>Error loading tokenizers:</strong> ${error.message}
        </div>
      `;
    }
  }

  // Main tokenization function
  async function compareTokenizers() {
    const text = textInput.value;
    
    if (!text.trim()) {
      alert('Please enter some text to tokenize');
      return;
    }
    
    const selectedTokenizerIds = [];
    document.querySelectorAll('.checkbox-group input:checked').forEach(checkbox => {
      selectedTokenizerIds.push(checkbox.value);
    });
    
    if (selectedTokenizerIds.length === 0) {
      alert('Please select at least one tokenizer');
      return;
    }
    
    tokenizeBtn.disabled = true;
    tokenizerCards.innerHTML = '';
    summaryStats.innerHTML = '';
    summaryStats.classList.remove('visible');
    
    const results = [];
    
    try {
      for (const tokenizerId of selectedTokenizerIds) {
        const tokenizerInfo = tokenizers[tokenizerId];
        if (!tokenizerInfo) continue;
        
        const tokenizer = tokenizerInfo.tokenizer;
        if (!tokenizer) continue;
        
        const startTime = performance.now();
        
        // Try different encode API signatures
        let tokenIds;
        try {
          // Try: encode(text, options)
          const encoded = tokenizer.encode(text, { add_special_tokens: false });
          if (encoded && encoded.input_ids) {
            tokenIds = encoded.input_ids;
          } else if (Array.isArray(encoded)) {
            tokenIds = encoded;
          } else {
            console.error('Unexpected encode result:', encoded);
            throw new Error('Tokenizer encode returned unexpected format');
          }
        } catch (e) {
          // Fallback: try encode(text)
          const encoded = tokenizer.encode(text);
          if (encoded && encoded.input_ids) {
            tokenIds = encoded.input_ids;
          } else if (Array.isArray(encoded)) {
            tokenIds = encoded;
          } else {
            throw e;
          }
        }
        
        const endTime = performance.now();
        
        const decodedTokens = tokenIds.map(id => tokenizer.decode([id]));
        
        results.push({
          id: tokenizerId,
          name: tokenizerInfo.name,
          encoding: tokenizerInfo.encoding,
          tokenIds: tokenIds,
          tokens: decodedTokens,
          tokenCount: tokenIds.length,
          encodingTime: (endTime - startTime).toFixed(2)
        });
      }
      
      if (results.length > 1) {
        const tokenCounts = results.map(r => r.tokenCount);
        const minTokens = Math.min(...tokenCounts);
        const maxTokens = Math.max(...tokenCounts);
        const bestTokenizer = results.find(r => r.tokenCount === minTokens);
        const worstTokenizer = results.find(r => r.tokenCount === maxTokens);
        const savings = ((1 - minTokens / maxTokens) * 100).toFixed(1);
        
        summaryStats.innerHTML = `
          <div class="stat-row"><span class="stat-label">Best:</span><span class="stat-value best">${bestTokenizer.name} (${minTokens} tokens)</span></div>
          <div class="stat-row"><span class="stat-label">Worst:</span><span class="stat-value worst">${worstTokenizer.name} (${maxTokens} tokens)</span></div>
          <div class="stat-row"><span class="stat-label">Savings:</span><span class="stat-value">${savings}% with ${bestTokenizer.name}</span></div>
        `;
        summaryStats.classList.add('visible');
      }
      
      results.forEach(result => {
        const card = document.createElement('div');
        card.className = 'tokenizer-card';
        const preview = result.tokens.slice(0, 30);
        const more = result.tokens.length > 30 ? ` (+${result.tokens.length - 30} more)` : '';
        
        card.innerHTML = `
          <div class="tokenizer-card-header"><span class="tokenizer-name">${result.name}</span><span class="token-count">${result.tokenCount}</span></div>
          <div class="encoding-time">${result.encoding} • ${result.encodingTime}ms</div>
          <div class="token-preview">${preview.map((t, i) => `<span class="token-chip" title="ID: ${result.tokenIds[i]}">${escapeHtml(t)}</span>`).join('')}${more ? `<span class="token-chip more">${more}</span>` : ''}</div>
          <div class="token-ids">IDs: [${result.tokenIds.slice(0, 15).join(', ')}${result.tokenIds.length > 15 ? '...' : ''}]</div>
        `;
        tokenizerCards.appendChild(card);
      });
    } catch (error) {
      console.error('Tokenization error:', error);
      console.error('Error stack:', error.stack);
      tokenizerCards.innerHTML = `<div class="error-message"><strong>Error:</strong> ${error.message}</div>`;
    } finally {
      tokenizeBtn.disabled = false;
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  tokenizeBtn.addEventListener('click', compareTokenizers);
  
  window.addEventListener('DOMContentLoaded', () => {
    initializeTokenizers();
    if (textInput.value.trim()) {
      setTimeout(compareTokenizers, 1000);
    }
  });

  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      compareTokenizers();
    }
  });
  </script>
</body>
</html>
